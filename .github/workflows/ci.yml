# CI: test + full embed release builds on every PR and main push.
# Workflow artifacts expire after 7 days (upload-artifact retention-days).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make build-go test vet
        run: make build-go test vet

  build-linux:
    name: linux-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build release binary (embed_python)
        run: make build-release-linux GOARCH=${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aid-cisco-cli-linux-${{ matrix.goarch }}-${{ github.run_id }}
          path: dist/aid-cisco-cli-linux-${{ matrix.goarch }}
          retention-days: 7
          if-no-files-found: error

  build-darwin-arm64:
    name: darwin-arm64
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aid-cisco-cli-darwin-arm64-${{ github.run_id }}
          path: dist/aid-cisco-cli-darwin-arm64
          retention-days: 7
          if-no-files-found: error

  build-darwin-amd64:
    name: darwin-amd64
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aid-cisco-cli-darwin-amd64-${{ github.run_id }}
          path: dist/aid-cisco-cli-darwin-amd64
          retention-days: 7
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build-linux, build-darwin-arm64, build-darwin-amd64]
    runs-on: ubuntu-latest
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aid-cisco-cli-*
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          shasum -a 256 aid-cisco-cli-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ github.run_id }}
          path: dist/checksums.txt
          retention-days: 7
