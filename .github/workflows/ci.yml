# CI: test + full embed release builds on every PR and main/release push.
# Embed builds run on all PRs (including forks) to catch breaking changes.
# Workflow artifacts are uploaded only on push to main or release/* (7-day retention).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"
  # Publish downloadable artifacts only from trusted branches (not PRs).
  PUBLISH_ARTIFACTS: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: make build-go test vet
        run: make build-go test vet

  build-linux:
    name: linux-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build release binary (embed_python)
        run: make build-release-linux GOARCH=${{ matrix.goarch }}

      - name: Verify release binary
        run: |
          test -f dist/aid-cisco-cli-linux-${{ matrix.goarch }}
          dist/aid-cisco-cli-linux-${{ matrix.goarch }} --version

      - name: Upload artifact
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-linux-${{ matrix.goarch }}-${{ github.run_id }}
          path: dist/aid-cisco-cli-linux-${{ matrix.goarch }}
          retention-days: 7
          if-no-files-found: error

  build-darwin-arm64:
    name: darwin-arm64
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=arm64

      - name: Verify release binary
        run: |
          test -f dist/aid-cisco-cli-darwin-arm64
          dist/aid-cisco-cli-darwin-arm64 --version

      - name: Upload artifact
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-darwin-arm64-${{ github.run_id }}
          path: dist/aid-cisco-cli-darwin-arm64
          retention-days: 7
          if-no-files-found: error

  build-darwin-amd64:
    name: darwin-amd64
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=amd64

      - name: Verify release binary
        run: |
          test -f dist/aid-cisco-cli-darwin-amd64
          dist/aid-cisco-cli-darwin-amd64 --version

      - name: Upload artifact
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-darwin-amd64-${{ github.run_id }}
          path: dist/aid-cisco-cli-darwin-amd64
          retention-days: 7
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build-linux, build-darwin-arm64, build-darwin-amd64]
    runs-on: ubuntu-latest
    if: >-
      env.PUBLISH_ARTIFACTS == 'true' &&
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: aid-cisco-cli-*
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          shasum -a 256 aid-cisco-cli-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v6
        with:
          name: checksums-${{ github.run_id }}
          path: dist/checksums.txt
          retention-days: 7
