# CI: test + full embed release builds on every PR and main/release push.
# Embed builds run on all PRs (including forks) to catch breaking changes.
# Versioned artifacts uploaded only on push to main or release/* (7-day retention).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: v2.17.1
          args: check

      - name: make build-go test-cover-check vet check-exit-docs
        run: make build-go test-cover-check vet check-exit-docs

      - name: Diff coverage on changed lines (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          make test-diff-cover-check DIFF_BASE="origin/${{ github.base_ref }}"

      - name: Smoke test CLI (help/version)
        run: make smoke-test VERSION="$(tr -d '[:space:]' < VERSION)"

  linux-amd64:
    name: linux-amd64
    needs: [test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v4

      - name: Build release binary (embed_python)
        run: make build-release-linux GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Verify release binary
        run: |
          bin="dist/cisco-aid-cli-${VERSION}-linux-amd64"
          test -f "$bin"
          make smoke-test-bin BIN="$bin" VERSION="$VERSION"

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-linux-amd64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-linux-amd64
          retention-days: 7
          if-no-files-found: error

  build-darwin-arm64:
    name: darwin-arm64
    needs: [test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=arm64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Verify release binary
        run: |
          bin="dist/cisco-aid-cli-${VERSION}-darwin-arm64"
          test -f "$bin"
          make smoke-test-bin BIN="$bin" VERSION="$VERSION"

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-arm64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-arm64
          retention-days: 7
          if-no-files-found: error

  build-darwin-amd64:
    name: darwin-amd64
    needs: [test]
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Python bundle + release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Verify release binary
        run: |
          bin="dist/cisco-aid-cli-${VERSION}-darwin-amd64"
          test -f "$bin"
          make smoke-test-bin BIN="$bin" VERSION="$VERSION"

      - name: Upload artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-amd64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-amd64
          retention-days: 7
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [test, linux-amd64, build-darwin-arm64, build-darwin-amd64]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cisco-aid-cli-*
          merge-multiple: true

      - name: Generate checksums.txt and manifest.json
        run: make checksums manifest VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Upload release metadata
        uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-metadata
          path: |
            dist/checksums.txt
            dist/manifest.json
          retention-days: 7
