# Advisory multi-persona PR review (read-only).
# - Posts/updates a single PR comment with PRS + findings
# - Never commits, pushes, or opens fix PRs
# - Requires repo secret: PERSONA_REVIEW_API_KEY
# Optional repo variables: PERSONA_REVIEW_PROVIDER (anthropic|openai), PERSONA_REVIEW_MODEL
name: PR Persona Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: persona-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  persona-review:
    name: persona-review
    runs-on: ubuntu-latest
    # Do not run on fork PRs (secrets + advisory scope).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve diff SHAs
        id: shas
        run: |
          git fetch origin main
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run persona review (read-only)
        id: review
        env:
          PERSONA_REVIEW_API_KEY: ${{ secrets.PERSONA_REVIEW_API_KEY }}
          PERSONA_REVIEW_PROVIDER: ${{ vars.PERSONA_REVIEW_PROVIDER }}
          PERSONA_REVIEW_MODEL: ${{ vars.PERSONA_REVIEW_MODEL }}
          PR_REVIEW_BASE_SHA: ${{ steps.shas.outputs.base }}
          PR_REVIEW_HEAD_SHA: ${{ steps.shas.outputs.head }}
        run: |
          python3 scripts/pr-persona-review/review.py > review-body.md
          echo "body_path=review-body.md" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- persona-review-bot -->';
            const body = fs.readFileSync('review-body.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Print report (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cat review-body.md
