# Bump VERSION, autofill CHANGELOG, finalize [Unreleased], push release/v* branch.
# Maintainer opens the PR manually (link in workflow summary).
# Merging that PR triggers Release on merge (auto-tag).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump (ignored if custom_version is set)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version (e.g. 1.0.0). Leave empty to use bump.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch to prepare from (e.g. main or release/0.1.x)'
        required: true
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Compute release version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
        run: |
          current="$(tr -d '[:space:]' < VERSION)"
          if [ -n "$CUSTOM" ]; then
            new="$CUSTOM"
          else
            IFS=. read -r major minor patch _ <<< "${current%%-*}"
            patch="${patch%%[^0-9]*}"
            case "$BUMP" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
            esac
            new="${major}.${minor}.${patch}"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Will release $current → $new from ${{ inputs.ref }}"

      - name: Autofill CHANGELOG
        env:
          PREPARE_REF: ${{ inputs.ref }}
        run: |
          python3 scripts/autofill-changelog.py --ref "$PREPARE_REF" --skip-internal

      - name: Run prepare-release.sh
        run: |
          chmod +x scripts/prepare-release.sh
          if [ -n "${{ inputs.custom_version }}" ]; then
            ./scripts/prepare-release.sh patch "${{ inputs.custom_version }}"
          else
            ./scripts/prepare-release.sh "${{ inputs.bump }}"
          fi

      - name: Push release branch
        env:
          BRANCH: release/v${{ steps.ver.outputs.new }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): prepare v${NEW}"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

      - name: Workflow summary — open PR manually
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.ref }}
          BRANCH: release/v${{ steps.ver.outputs.new }}
          CURRENT: ${{ steps.ver.outputs.current }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          base_enc="$(printf '%s' "$BASE" | jq -sRr @uri)"
          branch_enc="$(printf '%s' "$BRANCH" | jq -sRr @uri)"
          title_enc="$(printf 'chore(release): v%s' "$NEW" | jq -sRr @uri)"
          pr_url="https://github.com/${REPO}/compare/${base_enc}...${branch_enc}?expand=1&title=${title_enc}"
          {
            echo "## Prepare release v${NEW}"
            echo ""
            echo "Pushed \`${BRANCH}\` with VERSION \`${CURRENT}\` → \`${NEW}\`."
            echo ""
            echo "**Open a pull request manually** (base \`${BASE}\`, compare \`${BRANCH}\`):"
            echo ""
            echo "[Create pull request](${pr_url})"
            echo ""
            echo "After merge, **Release on merge** pushes \`v${NEW}\` and starts the Release workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open PR: ${pr_url}"
