# Promote an existing QA-approved prerelease without rebuilding or replacing assets.
name: Promote prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable-version prerelease tag to promote (e.g. v0.2.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate prerelease and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag such as v0.2.0"
            exit 1
          fi

          version="${TAG#v}"
          release_json="$(gh release view "$TAG" --repo "$REPO" \
            --json tagName,isDraft,isPrerelease,assets)"

          if [ "$(jq -r '.tagName' <<< "$release_json")" != "$TAG" ]; then
            echo "::error::Release tag does not match requested tag $TAG"
            exit 1
          fi
          if [ "$(jq -r '.isDraft' <<< "$release_json")" != "false" ]; then
            echo "::error::$TAG is a draft; publish it as a prerelease before promotion"
            exit 1
          fi
          if [ "$(jq -r '.isPrerelease' <<< "$release_json")" != "true" ]; then
            echo "::error::$TAG is not a prerelease"
            exit 1
          fi

          expected_assets=(
            "cisco-aid-cli-${version}-linux-amd64"
            "cisco-aid-cli-${version}-darwin-arm64"
            "checksums.txt"
            "manifest.json"
          )
          for asset in "${expected_assets[@]}"; do
            if ! jq -e --arg name "$asset" \
              'any(.assets[]; .name == $name and .size > 0)' \
              <<< "$release_json" >/dev/null; then
              echo "::error::Prerelease $TAG is missing non-empty asset: $asset"
              exit 1
            fi
          done

          echo "Validated prerelease $TAG and all expected assets."

  publish:
    name: promote-approved-prerelease
    needs: validate
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Revalidate and promote existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag such as v0.2.0"
            exit 1
          fi

          version="${TAG#v}"
          release_json="$(gh release view "$TAG" --repo "$REPO" \
            --json tagName,isDraft,isPrerelease,assets)"

          if [ "$(jq -r '.tagName' <<< "$release_json")" != "$TAG" ] || \
             [ "$(jq -r '.isDraft' <<< "$release_json")" != "false" ] || \
             [ "$(jq -r '.isPrerelease' <<< "$release_json")" != "true" ]; then
            echo "::error::$TAG is no longer an eligible prerelease"
            exit 1
          fi

          expected_assets=(
            "cisco-aid-cli-${version}-linux-amd64"
            "cisco-aid-cli-${version}-darwin-arm64"
            "checksums.txt"
            "manifest.json"
          )
          for asset in "${expected_assets[@]}"; do
            if ! jq -e --arg name "$asset" \
              'any(.assets[]; .name == $name and .size > 0)' \
              <<< "$release_json" >/dev/null; then
              echo "::error::Prerelease $TAG is missing non-empty asset: $asset"
              exit 1
            fi
          done

          gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest
          echo "Promoted $TAG to the latest stable release."

      - name: Promotion summary
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Promoted $TAG"
            echo ""
            echo "Promoted the existing QA-approved prerelease without rebuilding assets."
            echo ""
            echo "[Open release](https://github.com/${REPO}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
