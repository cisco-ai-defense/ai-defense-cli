# Build a versioned GitHub Release when a v* tag is pushed. Releases are drafts
# by default so internal QA can test the final assets before promotion.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.1). Use when Release did not start automatically.'
        required: true
        type: string
      draft:
        description: 'Keep the release as a draft for internal QA'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      tag: ${{ steps.v.outputs.tag }}
      draft: ${{ steps.v.outputs.draft }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag
        id: v
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            draft="$DISPATCH_DRAFT"
          else
            tag="${GITHUB_REF_NAME}"
            draft="true"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $tag (expected e.g. v0.1.1)"
            exit 1
          fi
          if [ "$draft" != "true" ] && [ "$draft" != "false" ]; then
            echo "::error::Invalid draft value: $draft"
            exit 1
          fi
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "::warning::VERSION file ($file_version) does not match tag ($version)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: make build-go test vet
        run: make build-go test vet

      - name: Smoke test CLI (help/version)
        run: make smoke-test VERSION="$(tr -d '[:space:]' < VERSION)"

  linux-amd64:
    name: linux-amd64
    needs: [test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v4

      - name: Build release binary
        run: make build-release-linux GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/cisco-aid-cli-${VERSION}-linux-amd64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-linux-amd64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-linux-amd64
          if-no-files-found: error

  build-darwin-arm64:
    name: darwin-arm64
    needs: [test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=arm64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/cisco-aid-cli-${VERSION}-darwin-arm64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-arm64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-arm64
          if-no-files-found: error

  build-darwin-amd64:
    name: darwin-amd64
    needs: [test]
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/cisco-aid-cli-${VERSION}-darwin-amd64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-amd64
          path: dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-amd64
          if-no-files-found: error

  release:
    name: release
    needs: [test, linux-amd64, build-darwin-arm64, build-darwin-amd64]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cisco-aid-cli-*
          merge-multiple: true

      - name: Generate checksums.txt and manifest.json
        run: make checksums manifest VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract-changelog-section.py \
            --version "$VERSION" \
            -o release-notes.md

      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: ${{ needs.test.outputs.draft }}
          tag_name: ${{ needs.test.outputs.tag }}
          name: ${{ needs.test.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/cisco-aid-cli-${{ needs.test.outputs.version }}-linux-amd64
            dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-amd64
            dist/cisco-aid-cli-${{ needs.test.outputs.version }}-darwin-arm64
            dist/checksums.txt
            dist/manifest.json

      - name: Release summary
        env:
          TAG: ${{ needs.test.outputs.tag }}
          DRAFT: ${{ needs.test.outputs.draft }}
          RELEASE_URL: ${{ steps.github-release.outputs.url }}
        run: |
          {
            echo "## GitHub Release $TAG"
            echo ""
            echo "Draft: \`$DRAFT\`"
            echo ""
            echo "[Open release]($RELEASE_URL)"
            if [ "$DRAFT" = "true" ]; then
              echo ""
              echo "After internal QA approval, run **Promote draft release** with tag \`$TAG\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
