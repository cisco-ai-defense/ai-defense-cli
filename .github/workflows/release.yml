# Publish a versioned GitHub Release when a v* tag is pushed.
# Tag name (e.g. v0.1.0) becomes the release version; keep VERSION file in sync.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.1). Use when Release did not start automatically.'
        required: true
        type: string

permissions:
  contents: write

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid tag: $tag (expected e.g. v0.1.1)"
            exit 1
          fi
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "::warning::VERSION file ($file_version) does not match tag ($version)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: make build-go test vet
        run: make build-go test vet

      - name: Smoke test CLI (help/version)
        run: make smoke-test VERSION="$(tr -d '[:space:]' < VERSION)"

  linux-amd64:
    name: linux-amd64
    needs: [test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v4

      - name: Build release binary
        run: make build-release-linux GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/aid-cisco-cli-${VERSION}-linux-amd64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-${{ needs.test.outputs.version }}-linux-amd64
          path: dist/aid-cisco-cli-${{ needs.test.outputs.version }}-linux-amd64
          if-no-files-found: error

  build-darwin-arm64:
    name: darwin-arm64
    needs: [test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=arm64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/aid-cisco-cli-${VERSION}-darwin-arm64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-arm64
          path: dist/aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-arm64
          if-no-files-found: error

  build-darwin-amd64:
    name: darwin-amd64
    needs: [test]
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          make bundle
          make build-release-darwin GOARCH=amd64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Smoke test release binary
        run: make smoke-test-bin BIN="dist/aid-cisco-cli-${VERSION}-darwin-amd64" VERSION="$VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-amd64
          path: dist/aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-amd64
          if-no-files-found: error

  release:
    name: release
    needs: [test, linux-amd64, build-darwin-arm64, build-darwin-amd64]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
      COMMIT: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: aid-cisco-cli-*
          merge-multiple: true

      - name: Generate checksums.txt and manifest.json
        run: make checksums manifest VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/extract-changelog-section.py \
            --version "$VERSION" \
            -o release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          name: ${{ needs.test.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/aid-cisco-cli-${{ needs.test.outputs.version }}-linux-amd64
            dist/aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-amd64
            dist/aid-cisco-cli-${{ needs.test.outputs.version }}-darwin-arm64
            dist/checksums.txt
            dist/manifest.json
