# Example user config.toml (generated by cisco-aid-cli onboard / config init)
#
# Schema contract: internal/config/spec/config.spec.yaml
# Only enabled capability sections are written; secrets are mode 0600.

[default]
api_key = "<your-ai-defense-api-key>"
base_url = "https://us.api.aidefense.security.cisco.com"

# Optional — Private HuggingFace repos (capability: huggingface)
[default.huggingface]
token = "hf_..."

# Optional — Local AIBOM analysis (capability: aibom)
[default.aibom]
llm_model = "gpt-5.4"
llm_provider = ""
llm_api_key = "sk-..."
llm_api_base = ""
llm_api_version = ""

# Wizard progress only (safe to delete after onboarding is complete)
[onboard]
step = "complete"
