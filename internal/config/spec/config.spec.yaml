# config.spec.yaml — CLI configuration schema for cisco-aid-cli
#
# Fields under [default] in config.toml. Scalar fields map to string keys; kind: group
# maps to nested tables (e.g. huggingface.token → [default.huggingface]).
#
# User secrets live in config.toml (mode 0600). This file is schema only.

meta:
  schema_version: "1"
  name: cisco-aid-cli-config
  description: Configuration schema for Cisco AI Defense CLI

sections:
  - id: default
    label: AI Defense
    required: true
    fields:
      - key: api_key
        title: AI Defense API key
        kind: secret
        required: true
        env: AI_DEFENSE_API_KEY
        flag: api-key

      - key: base_url
        title: Base URL
        required: true
        env: AI_DEFENSE_BASE_URL
        flag: base-url
        description: AI Defense API endpoint for your tenant
        allow_custom: true
        options:
          - label: United States (US)
            value: https://us.api.aidefense.security.cisco.com
          - label: Europe (EU)
            value: https://eu.api.aidefense.security.cisco.com
          - label: Asia Pacific (AP)
            value: https://ap.api.aidefense.security.cisco.com
          - label: United Arab Emirates (UAE)
            value: https://uae.api.aidefense.security.cisco.com

      - key: huggingface
        kind: group
        label: Private HuggingFace model repos
        description: Access gated or private models on huggingface.co
        optional: true
        missing_hint: Run 'cisco-aid-cli config edit' and enable Private HuggingFace model repos
        next_steps:
          - "Scan a private model: cisco-aid-cli model-scan trigger --repo-url https://huggingface.co/org/model"
        fields:
          - key: token
            title: HuggingFace token
            description: Paste a token with read access to your private repos (hf_...)
            kind: secret
            required: true
        validate:
          - type: non_empty
            field: token
            message: huggingface token is required

      - key: aibom
        kind: group
        label: Local AIBOM analysis
        description: Generate AI Bills of Materials from source on this machine
        optional: true
        missing_hint: Run 'cisco-aid-cli config edit' and enable Local AIBOM analysis
        next_steps:
          - "Analyze locally: cisco-aid-cli ai-bom analyze . --llm-model <model>"
        validator: aibom_llm
        fields:
          - key: llm_model
            title: LLM model
            description: "LLM model name (e.g. gpt-5.4, us.anthropic.claude-sonnet-4-20250514-v1:0). The agent classifies every scanner candidate; the legacy 'provider/model' prefix is still accepted."
            env: AIBOM_LLM_MODEL
            flag: llm-model
          - key: llm_provider
            title: LLM provider
            description: "LLM provider for LangChain (e.g. bedrock, openai, anthropic, azure_openai, google_genai, ollama). If unset, inferred from the model name or a 'provider/' prefix."
            env: AIBOM_LLM_PROVIDER
            flag: llm-provider
          - key: llm_api_key
            title: LLM API key
            description: "LLM API key. May be optional for a local LLM or AWS Bedrock."
            kind: secret
            env: AIBOM_LLM_API_KEY
            flag: llm-api-key
          - key: llm_api_base
            title: LLM API base URL
            description: "LLM API base URL (Azure endpoint or local URL, e.g. http://localhost:11434)."
            env: AIBOM_LLM_API_BASE
            flag: llm-api-base
          - key: llm_api_version
            title: LLM API version
            description: "LLM API version (for Azure OpenAI). May be optional for other providers."
            env: AIBOM_LLM_API_VERSION
            flag: llm-api-version
        presets:
          - id: cloud
            label: OpenAI / Anthropic / Google
            set:
              llm_provider: ""
            prompt: [llm_model, llm_api_key]
          - id: azure
            label: Azure OpenAI
            prompt: [llm_model, llm_api_key, llm_api_base, llm_api_version]
          - id: bedrock
            label: AWS Bedrock
            set:
              llm_provider: bedrock
            prompt: [llm_model]
            omit: [llm_api_key]
          - id: local
            label: Ollama / local endpoint
            prompt: [llm_model, llm_api_base]
            omit: [llm_api_key]
